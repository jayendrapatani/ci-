name : CI 

on : push 

jobs : 
  linting:
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        os :[ubuntu-latest,windows-latest]
    steps :
      - name : code checkout
        uses : actions/checkout@v3
      - name : setup python
        uses : actions/setup-python@v2
        with :
          python-version: '3.12' 
      - name : install flake8
        run :
          pip install flake8
      - name : run flake8
        run :
          flake8 ml.py

